<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Տվյալահեն որոշումներ և թվային գործիքներ ղեկավարների համար</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700&family=Noto+Serif+Armenian:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f7;--sf:#ffffff;--ink:#12303b;--mu:#4d6b77;--pri:#0a6c8a;--acc:#e8a317;--co:#d03b47;--ok:#12805c;--bd:#d3dfe4;--so:#e4eff3;--hero:#0a3140;--hi:#fff4d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b181e;--sf:#12252d;--ink:#e6f1f4;--mu:#9db7c1;--pri:#55c6ea;--acc:#f2b83a;--co:#ff7d86;--ok:#4ad3a3;--bd:#27424d;--so:#183039;--hero:#071e28;--hi:#3a3114}}
:root[data-theme="dark"]{--bg:#0b181e;--sf:#12252d;--ink:#e6f1f4;--mu:#9db7c1;--pri:#55c6ea;--acc:#f2b83a;--co:#ff7d86;--ok:#4ad3a3;--bd:#27424d;--so:#183039;--hero:#071e28;--hi:#3a3114}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 'Noto Sans Armenian',system-ui,sans-serif}
h1,h2,h3{font-family:'Noto Serif Armenian',Georgia,serif;line-height:1.2;margin:0}
.wrap{display:flex;max-width:1360px;margin:0 auto}
nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;width:270px;flex:none;height:100vh;overflow:auto;padding:28px 12px 28px 20px}
nav b{display:block;font:700 15px 'Noto Serif Armenian',serif;padding:0 12px 14px;color:var(--mu)}
nav a{display:block;padding:8px 12px;border-radius:8px;color:var(--mu);text-decoration:none;font-size:15px;line-height:1.35;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:var(--so);color:var(--ink)}
nav a.on{background:var(--so);color:var(--ink);font-weight:700;border-left-color:var(--acc)}
main{flex:1;min-width:0;padding:0 28px 80px}
.hero{background:var(--hero);color:#f3f8fa;border-radius:0 0 28px 28px;padding:56px 44px 40px;margin:0 -28px 24px}
.hero p{color:#b9d3dc;margin:0}
.hero h1{font-size:clamp(30px,5vw,54px);max-width:18ch;margin:10px 0 14px;color:#fff}
.hero .sub{font-size:21px;max-width:40ch;color:#ffd978}
.kf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:30px 0 26px}
.kf div{border-top:3px solid var(--acc);padding-top:8px}
.kf strong{display:block;font:700 40px/1.1 'Noto Serif Armenian',serif;color:#fff}
.kf span{font-size:15px;color:#b9d3dc}
.strip{display:flex;gap:6px;height:54px}
.strip div{display:flex;align-items:center;padding:0 12px;border-radius:10px;font-size:14px;font-weight:700;color:#06222d;white-space:nowrap;overflow:hidden}
.theme{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);z-index:20;border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px 'Noto Sans Armenian',sans-serif;cursor:pointer}
section{padding:44px 0 8px}
section>h2{font-size:clamp(26px,3.4vw,36px);margin-bottom:6px}
section>.lead{color:var(--mu);margin:0 0 22px;max-width:70ch}
h3{font-size:20px;margin:26px 0 10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px 22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid .card h4{margin:0 0 6px;font-size:17px;color:var(--pri)}
.grid .card p{margin:0;font-size:15.5px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.45}
th{background:var(--so);text-align:left;padding:11px 14px;font-weight:700;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--bd);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.hl td{background:var(--hi);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chips button,.tabs button{font:600 15px 'Noto Sans Armenian',sans-serif;border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.chips button[aria-pressed=true],.tabs button[aria-selected=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pan h3{margin:0 0 6px}
.pan .big{font:700 44px 'Noto Serif Armenian',serif;color:var(--pri)}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.ok h3{color:var(--ok);margin-top:0}.no h3{color:var(--co);margin-top:0}
ul{margin:8px 0 0;padding-left:22px}li{margin:4px 0}
.note{font-size:14.5px;color:var(--mu);margin-top:12px}
.gantt{display:grid;grid-template-columns:230px repeat(16,minmax(24px,1fr));gap:4px 2px;align-items:center;min-width:760px;font-size:14px}
.gantt .wk{text-align:center;color:var(--mu);font-size:12px}
.gantt .lb{line-height:1.25;padding-right:8px}.gantt .lb small{display:block;color:var(--mu);font-size:12px}
.gantt .bar{height:26px;border-radius:7px;background:var(--co)}
.gantt .bar.fl{background:var(--mu);opacity:.65}
.gantt .bar:hover{outline:3px solid var(--acc)}
.leg{display:flex;gap:18px;margin-top:10px;font-size:14px;color:var(--mu)}
.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.hb{display:grid;grid-template-columns:minmax(120px,230px) 1fr 100px;gap:8px 12px;align-items:center;font-size:15px}
.hb .tr{background:var(--so);border-radius:7px;height:24px;overflow:hidden}
.hb .fi{height:100%;border-radius:7px;background:var(--pri);transition:width .35s}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sl{width:100%;accent-color:var(--pri);height:34px}
.out{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:14px 0}
.out div{background:var(--so);border-radius:12px;padding:12px 14px}.out b{display:block;font:700 24px 'Noto Serif Armenian',serif}
.out span{font-size:14px;color:var(--mu)}
.pos{color:var(--ok)}.neg{color:var(--co)}
svg{display:block;width:100%;height:auto}
svg text{font-family:'Noto Sans Armenian',sans-serif;fill:var(--mu);font-size:12px}
.mx{display:grid;grid-template-columns:34px repeat(3,1fr);gap:6px}
.mx .c{min-height:76px;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.mx .ax{font-size:13px;color:var(--mu);display:flex;align-items:center;justify-content:center;text-align:center}
.mx button,.q button.s{font:700 14px 'Noto Sans Armenian',sans-serif;border:2px solid var(--ink);background:var(--sf);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;height:34px}
.mx button[aria-pressed=true]{background:var(--ink);color:var(--sf)}
.q{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q .card{min-height:120px}.q h4{margin:0 0 4px;color:var(--pri);font-size:16px}.q p{margin:0 0 6px;font-size:13.5px;color:var(--mu)}
.q .nm{font-size:14.5px;margin:3px 0}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;list-style:none}
.steps li{counter-increment:s;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 16px 12px 52px;position:relative;margin:0}
.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#1b1b1b;font-weight:700;text-align:center;line-height:26px;font-size:14px}
a.src{color:var(--pri)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-width:900px){.wrap{display:block}nav{position:sticky;width:auto;height:auto;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);z-index:10;border-bottom:1px solid var(--bd)}nav b{display:none}nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:6px 10px}nav a.on{border-bottom-color:var(--acc)}main{padding:0 16px 60px}.hero{margin:0 -16px 20px;padding:48px 22px 30px}.theme{top:calc(env(safe-area-inset-top,0px) + 60px)}.hb{grid-template-columns:1fr 80px}.hb .tr{grid-column:1/-1;order:3}.q{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.hb .fi{transition:none}}

:root{--g1:#1a8fb3;--g2:#8a6bf0;--g3:#e8a317;--g4:#ef5a67;--g5:#2bb585}
#pg{position:fixed;left:0;top:0;height:4px;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#1a8fb3,#8a6bf0,#e8a317,#ef5a67);z-index:30}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;background:radial-gradient(800px 420px at 88% 8%,rgba(232,163,23,.38),transparent 62%),radial-gradient(700px 520px at 6% 105%,rgba(85,198,234,.28),transparent 60%),radial-gradient(500px 360px at 55% 40%,rgba(138,107,240,.22),transparent 65%),var(--hero);padding:64px 48px 44px}
.hero h1{font-size:clamp(34px,5.4vw,62px)}
.hi{width:100%;max-width:420px;justify-self:center;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.flags{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:#b9d3dc}
.kf strong{font-size:46px}
section{background:color-mix(in srgb,var(--sc) 8%,transparent);border-radius:26px;padding:34px 30px 24px;margin:22px 0}
section>h2{border-left:8px solid var(--sc);padding-left:16px}
section>.lead{font-size:18px}
.card{box-shadow:0 10px 24px -16px rgba(10,49,64,.5)}
.grid .card,.q .card{border-top:5px solid var(--sc);transition:transform .2s}
.grid .card:hover,.q .card:hover{transform:translateY(-3px)}
tr:hover td{background:var(--so)}tr.hl:hover td{background:var(--hi)}
.steps li::before{background:var(--sc)}
nav a::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sc);margin-right:10px}
nav a.on{border-left-color:var(--sc)}
.hb .fi{background:var(--sc)}
.out b{font-size:28px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.tiles div{border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,var(--t),color-mix(in srgb,var(--t) 50%,#000))}
.tiles b{display:block;font:700 32px/1.15 'Noto Serif Armenian',serif}.tiles span{font-size:15px;opacity:.92}
.dn{display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:center}
.dc{position:relative}.dc div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dc b{font:700 26px 'Noto Serif Armenian',serif}.dc span{font-size:13px;color:var(--mu)}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 22px;font-size:14.5px}
.lg h4{grid-column:1/-1;margin:6px 0 2px;font-size:16px}
.lg p{margin:0;display:flex;gap:8px;align-items:baseline}.lg i{width:12px;height:12px;border-radius:4px;flex:none}.lg em{margin-left:auto;font-style:normal;font-weight:700;white-space:nowrap}
.gantt .bar{transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.gantt.in .bar{transform:scaleX(1)}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:48px 22px 30px}.hi{max-width:300px}section{padding:24px 16px 16px;border-radius:20px}.dn{grid-template-columns:1fr}.dc{max-width:260px;margin:auto}}
@media (prefers-reduced-motion:reduce){.gantt .bar{transform:none;transition:none}.grid .card{transition:none}}
</style>
</head>
<body>
<div id="pg"></div>
<button class="theme" id="th" aria-label="Փոխել թեման">Մուգ / բաց</button>
<div class="wrap"><nav id="nav" aria-label="Բաժիններ"><b>Բովանդակություն</b></nav><main id="main"></main></div>
<script>
const f=n=>Math.round(n).toLocaleString('en-US'),$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const tbl=(h,r,o={})=>`<div class="tw"><table><tr>${h.map((x,i)=>`<th class="${(o.n||[]).includes(i)?'n':''}">${x}</th>`).join('')}</tr>${r.map((x,k)=>`<tr class="${o.hl===k?'hl':''}">${x.map((c,i)=>`<td class="${(o.n||[]).includes(i)?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const cards=a=>`<div class="grid">${a.map(([h,t])=>`<div class="card"><h4>${h}</h4><p>${t}</p></div>`).join('')}</div>`;
const mods=[['Կառավարչական խնդիր և ցուցանիշներ','Ձևակերպում է որոշման հարցը և ընտրում է 2–3 հիմնավորված ցուցանիշ։'],['Տվյալների որակ և աղյուսակային մշակում','Մաքրում է փոքր տվյալաշարը և բացատրում բացակայող ու կրկնվող տվյալների ազդեցությունը։'],['Հիմնական վերլուծություն','Համեմատում է խմբերն ու ժամանակահատվածները՝ առանց պատճառական չհիմնավորված եզրակացության։'],['Վիզուալացում և կառավարչական հաշվետվություն','Կազմում է պարզ վահանակ՝ հասկանալի վերնագրերով և առանցքների անվանումներով։'],['Թվային գործընթացի բարելավում','Առաջարկում է փոքր փոփոխություն՝ նշելով ռեսուրսը, պատասխանատուին և ռիսկը։'],['Կիրառական ավարտական աշխատանք','Ներկայացնում է տվյալների վրա հիմնված առաջարկ և պատասխանում գնահատողի հարցերին։']];
const dev=[['Մոդուլների ծրագրերի մշակում','36 ժ × 5,000',180000],['Նյութեր և դեպքեր','24 ժ × 5,000',120000],['Երկու անկախ վերանայող','12 ժ × 6,000',72000],['Նախագծային պլանավորում և փակում','24 ժ × 4,000',96000],['Պահոցի սկզբնական կարգավորում','12 ժ × 4,000',48000],['Մեկնարկային էջ և տեղեկանյութ','Ֆիքսված',40000]];

`<div class="tabs" role="tablist" id="mt">${mods.map((m,i)=>`<button role="tab" aria-selected="${i==0}" data-i="${i}">Մոդուլ ${i+1}</button>`).join('')}</div><div class="card pan" id="mp"></div>
<h3>Շրջանակ</h3><div class="two"><div class="card ok"><h3>Ներառված է</h3><ul><li>Կարիքի ստուգում</li><li>6 մոդուլի ծրագիր, նյութեր և առաջադրանքներ</li><li>Գնահատման սանդղակ</li><li>Դասավանդողների պատրաստություն</li><li>Առաջին հոսք, վերամշակում, փոխանցում</li></ul></div><div class="card no"><h3>Դուրս է</h3><ul><li>Բակալավրի կամ մագիստրոսի աստիճանային ծրագիր</li><li>Նոր մասնաշենք, նոր համակարգչային պարկ</li><li>Առանձին ծրագրային հարթակի ստեղծում</li><li>Աշխատանքի տեղավորման երաշխիք</li></ul></div></div>
<p class="note">Նոր պահանջը (օրինակ՝ խորացված ծրագրավորում) ինքնաբերաբար չի ներառվում․ այն գնահատվում է որպես շրջանակի փոփոխություն։</p>`);

add('wbs','Աշխատանքների տրոհում (WBS)','Արդյունքները բաժանված են 8 աշխատանքային փաթեթի։ Բոլոր վերջնարդյունքները կապվում են պահանջի, պատասխանատուի և ստուգման ապացույցի հետ։',
tbl(['Կոդ','Աշխատանքային փաթեթ','Հանձնվող արդյունք','Պատասխանատու'],[['1','Նախագծի կառավարում','Կանոնադրություն, պլան, որոշումների և ռիսկերի գրանցումներ, հաշվետվություն','Նախագծի ղեկավար'],['2','Պահանջարկ և պահանջներ','5 հարցազրույցի, 30 հարցման և վճարի ընդունելիության ամփոփում','Ակադեմիական ղեկավար'],['3','Ծրագրի ճարտարապետություն','48 ժամ, 6 մոդուլ, վերջնարդյունքների ու գնահատումների համապատասխանեցում','Ակադեմիական ղեկավար'],['4','Ուսումնական փաթեթներ (4.1–4.6)','Յուրաքանչյուր մոդուլի նյութեր, առաջադրանք և գնահատման սանդղակ','3 դասավանդող՝ 2-ական մոդուլ'],['5','Գործարկման պատրաստություն','Պահոց, ստուգված գործիքներ, հաստատված լսարան, գրանցված խումբ','ՏՏ և վարչական աջակցություն'],['6','Առաջին հոսք','48 ժամ ուսուցում, հաճախումների ու առաջադրանքների գրանցումներ','Դասավանդողներ'],['7','Գնահատում և բարելավում','Գնահատված աշխատանքներ, արձագանքների ամփոփում, ուղղված տարբերակ','Որակ և հեղինակներ'],['8','Փոխանցում և փակում','Ընդունման արձանագրություն, ծախսերի ամփոփում, սեփականատեր','Ղեկավար և հովանավոր']]));

add('time','Ժամանակացույց և կրիտիկական ուղի','Պատրաստություն՝ 6 շաբաթ, առաջին հոսք՝ 8 շաբաթ, վերամշակում և փոխանցում՝ 2 շաբաթ։ Երկու կրիտիկական ուղի կա՝ A–B–C–D–E–F–G և A–B–C–J–E–F–G (1+1+1+3+8+1+1 = 16 շաբաթ)։',

add('team','Կազմակերպական կառուցվածք և լիազորություններ','Ընտրված է հավասարակշռված մատրիցա․ աշխատակիցները պահպանում են հիմնական պաշտոնները, իսկ նախագծային ժամերը ամրագրվում են բաժինների ղեկավարների հետ։ Նոր գրասենյակ չի ստեղծվում։',
tbl(['Դեր','Լիազորություն և պատասխանատվություն'],[['Հովանավոր','Հաստատում է կանոնադրությունը, ֆինանսական սահմանները, մեկնարկը, էական փոփոխությունները և լուծում կազմակերպական խոչընդոտները։'],['Նախագծի ղեկավար','Համաձայնեցնում է աշխատանքները, վարում գրանցամատյանները, հետևում հանգրվաններին, էսկալացնում հակասությունները։'],['Ակադեմիական ղեկավար և 3 դասավանդող','Ակադեմիական ղեկավարը հաստատում է ամբողջականությունը․ դասավանդողները մշակում և անցկացնում են իրենց 2-ական մոդուլը։'],['Որակի ապահովման պատասխանատու','Ստուգում է չափանիշները և տալիս ընդունման եզրակացություն՝ հեղինակից անկախ։'],['ՏՏ և վարչաֆինանսական աջակցություն','Տեխնիկական պատրաստություն, գրանցում, փաստացի վճարների ու ծախսերի հաշվառում։']])+`<p class="note">Այլ կառուցվածքները չեն ընտրվել․ ֆունկցիոնալը կարող է ուշացնել ծրագիրը, նախագծայինը մեծացնում է ծախսը, թույլ և ուժեղ մատրիցաների լիազորությունները համապատասխանաբար ցածր կամ բարձր են անհրաժեշտից։</p>`);

add('stake','Շահակիցներ և հաղորդակցություն','Ազդեցության և հետաքրքրության մատրիցա՝ մոդելային մեկնարկային գնահատումներով, որոնք ճշտվում են հարցազրույցներով։',
`<div class="q">${[['Բավարարված պահել','Ազդեցություն բարձր, հետաքրքրություն ցածր',[['Ֆինանսական և ՏՏ ղեկավարներ','Վճարումների կարգ, կանխատեսելի աջակցություն․ նպատակային հաստատումներ։']]],['Մոտիկից կառավարել','Ազդեցություն բարձր, հետաքրքրություն բարձր',[['Հովանավոր','Հանգրվանների որոշումներ։'],['Ակադեմիական ղեկավար','Շաբաթական համատեղ քննարկում։'],['Դասախոսներ','Ներգրավել մշակման և փոփոխությունների քննարկման մեջ։']]],['Մշտադիտարկել','Ազդեցություն ցածր, հետաքրքրություն ցածր',[['Չներգրավված այլ բաժիններ','Անհրաժեշտության դեպքում նորից գնահատել։']]],['Տեղեկացված պահել','Ազդեցություն ցածր, հետաքրքրություն բարձր',[['Հնարավոր մասնակիցներ','Հարցում և բաց քննարկում։'],['Գործատուներ','Հարցազրույց և նախագծի քննարկում։']]]].map(([h,s,l])=>`<div class="card"><h4>${h}</h4><p>${s}</p>${l.map(([a,b])=>`<div class="nm"><b>${a}</b> — ${b}</div>`).join('')}</div>`).join('')}</div>
<h3>Հաղորդակցության պլան</h3>`+tbl(['Ում','Ինչ և երբ','Մեթոդ և պատասխանատու'],[['Հովանավոր','Ծախս, ժամկետ, ռիսկ, պահանջվող որոշում․ յուրաքանչյուր 2 շաբաթ','Կարճ հաշվետվություն և հանդիպում․ նախագծի ղեկավար'],['Դասավանդողներ','Պատրաստ նյութեր, հաջորդ առաջադրանք, խոչընդոտներ․ շաբաթական 30 րոպե','Համատեղ քննարկում․ նախագծի ղեկավար'],['Որակի ապահովում','Տարբերակներ և ստուգաթերթեր․ 3-րդ, 6-րդ, 14-րդ, 15-րդ շաբաթներ','Ընդհանուր պահոց․ ակադեմիական ղեկավար'],['Մասնակիցներ','Ժամանակացույց, առաջադրանք, գնահատման կանոն, վճարման օր','Նամակ / փակ խումբ․ վարչական պատասխանատու'],['Գործատուներ','Հմտությունների ցանկ․ 1–2-րդ և 15-րդ շաբաթներ','Հարցազրույց․ ակադեմիական ղեկավար']])+`<p class="note">8 անդամից կազմված հիմնական խմբում հնարավոր երկկողմ կապերի թիվը 8 × 7 / 2 = 28 է։ Միասնական պահոցը և հստակ պատասխանատուները նվազեցնում են չհամակարգված փոխանակումը։</p>`);

add('cash','Ֆինանսավորում և մեկնարկի ստուգում','Մինչև առաջին վճարումները առաջարկվում է մինչև 650,000 դրամ շրջանառու ֆինանսավորում․ դա արդեն հաշվարկված ծախսերի ժամանակին ապահովումն է, ոչ նոր ծախս։',
`<div class="card"><svg id="cf" viewBox="0 0 640 270" role="img" aria-label="Կուտակային ծախս և պլանային վճարների մուտք՝ ըստ շաբաթների"></svg></div><h3>Փուլեր</h3>`+tbl(['Փուլ','Դրամական աշխատանք','Պլանային վճարների մուտք'],[['1–6-րդ շաբաթ','552,000','6-րդ շաբաթի վերջում՝ 22 × 40,000 = 880,000'],['7–10-րդ շաբաթ','326,000','Մինչև 10-րդ շաբաթ՝ ևս 880,000'],['11–14-րդ շաբաթ','282,000','Չհավաքագրվածը առանձին է հետևվում'],['15–16-րդ շաբաթ','76,000','Ամփոփ ֆինանսական հաշվառում'],['Ընդամենը','1,236,000','1,760,000 (ամբողջական հավաքագրման դեպքում)']],{hl:4})+`<h3>6-րդ շաբաթի մեկնարկային ստուգում</h3><ol class="steps"><li>6 մոդուլը, գնահատման սանդղակը, պահոցը, գործիքները և լսարանի ժամանակացույցը պատրաստ ու ընդունված են։</li><li>Կան առնվազն 20 ամբողջ վճարին համաձայնած մասնակից և առնվազն 800,000 դրամ առաջին վճարումներ։</li><li>Բուհը հաստատել է գումարների, վերադարձի, մասնակցության և ավարտի փաստաթղթի պայմանները։</li><li>Վճարողների պակասի դեպքում որոշվում է՝ հետաձգել, փոփոխել առաջարկը կամ հաստատել համաֆինանսավորում (օրինակ՝ 18 մասնակցի դեպքում պակասը 94,600 դրամ է)։</li></ol><p class="note">Շրջանառու գումարը վերադարձվում է միայն վճարումների հավաքագրումից և պարտավորությունների կատարումից հետո։ Խոստացված վճարը դրամական մուտք չէ։</p>`);

add('load','Ռեսուրսային բեռ և հակասություններ','Հիմնական խումբը 8 դերակատար է, արտաքին 2 վերանայողները միանում են սահմանված առաջադրանքով։ Բեռը համեմատվում է ոչ միայն միջին, այլ նաև պիկ շաբաթների համար։',
tbl(['Ռեսուրս','Պլանային ներգրավում','Կարողության պայման'],[['3 դասավանդող','Յուրաքանչյուրը՝ 20 ժ ստեղծում, 16 ժ ուսուցում, ~8.8 ժ գնահատում','4–6-րդ շաբաթ՝ առնվազն 6 ժ / շաբաթ, 7–14-րդ՝ միջինում 3–4 ժ'],['Նախագծի ղեկավար','Ընդհանուր 48 ժ','Շաբաթական ~3 ժ, նախապես ամրագրված՝ մինչև 4 ժ'],['ՏՏ և վարչական աջակցություն','ՏՏ՝ 20 ժ, վարչական՝ 16 ժ','Առաջադրանքների և արձագանքման ժամերի համաձայնեցում'],['Ակադեմիական ղեկավար և որակի մասնագետ','Ընդհանուր 6 ժ համաձայնեցումներ','Մանրամասն անկախ վերանայումը առանձին վճարովի տող է']])+`<h3>Հակասություններ և լուծումներ</h3>`+tbl(['Հակասություն','Կառավարչական լուծում'],[['Հեղինակի դասերը համընկնում են նյութի պատրաստման հետ','Գրավոր ամրագրված 6 ժ / շաբաթ․ առաջադրանք չի տրվում զբաղվածությունը չստուգած աշխատակցին։'],['Լսարանը նույն ժամին պետք է այլ ծրագրի','16 հանդիպումները և պահեստային ժամերը ամրագրվում են մինչև հավաքագրումը։'],['ՏՏ մասնագետին տրվել է անհետաձգելի այլ հանձնարարություն','Նյութերը նաև ներբեռնվող են, տեխնիկական հարցերը՝ մեկ պատասխանատու և հերթագրում։'],['Երկու ղեկավար հակասող առաջնահերթություն են տալիս','Լուծվում է նույն օրը, չլուծվածը 2 աշխատանքային օրում ներկայացվում է հովանավորին։']]));

add('qual','Որակ և ընդունման չափանիշներ','Ավարտական աշխատանքը գնահատվում է 100 միավորով․ հաջողության շեմը 70 է։ Խմբային քննարկումը թույլատրելի է, բայց վերջնական արդյունքը գնահատվում է անհատապես։',
`<div class="card"><div class="hb" id="qb"></div></div><h3>Ինչ և ով է ընդունում</h3>`+tbl(['Արդյունք','Ընդունման ստուգում','Ընդունող'],[['Ծրագրի կառուցվածք','6 մոդուլ, 48 ժամ, պահանջների հետ կապ, նախապայմաններ, վերջնարդյունքներ','Ակադեմիական ղեկավար'],['Յուրաքանչյուր մոդուլի փաթեթ','Նյութ, գործնական դեպք, առաջադրանք, պատասխանների ուղեցույց, գնահատման չափանիշ','Ակադեմիական ղեկավար՝ անկախ վերանայմամբ'],['Տեխնիկական պատրաստություն','Բոլորը կարող են բացել նյութերը, աշխատել գործիքով և հանձնել առաջադրանք','ՏՏ և որակի պատասխանատու'],['Առաջին հոսք','48 ժամի գրանցում, անհատական գնահատում, հաշվարկվող KPI-ներ','Որակի պատասխանատու'],['Վերջնական փոխանցում','Ուղղված նյութեր, զրո կրիտիկական թերություն, ծախսերի ամփոփում, մշտական պատասխանատու','Իրավասու ղեկավար մարմին']])+`<p class="note">Կրիտիկական թերություն է բացակայող պարտադիր մոդուլը, անաշխատունակ գործիքը կամ վերջնարդյունքին չհամապատասխանող գնահատումը․ դրանք չեն փոխհատուցվում բարձր բավարարվածությամբ։</p>`);

add('kpi','KPI համակարգ','3 հիմնական, 2 բացատրող և 2 սահմանափակող ցուցանիշ։ Թիրախները նախնական են․ նախորդ հոսքերի չափված ելակետ չկա, և շեմերը հետադարձ չեն իջեցվում։',
`<div class="chips" id="kc">${[['*','Բոլորը'],['K','Հիմնական'],['D','Բացատրող'],['G','Սահմանափակող']].map(([k,t],i)=>`<button aria-pressed="${i==0}" data-k="${k}">${t}</button>`).join('')}</div><div id="kt"></div><p class="note">Բավարարվածությունը հմտության ապացույց չէ, իսկ ցածր ծախսը ժամանակացույցից հետ մնալու դեպքում արդյունավետության ապացույց չէ։ K1-ի բացթողման դեպքում ուսուցումը չի սկսվում․ K3-ի պակասը ներկայացվում է հովանավորին։ 20 հոգու խմբի դեպքում ուսումնական շեմը առնվազն 16 հաջող գնահատված մասնակիցն է։</p>`);

add('risk','Ռիսկեր','Գնահատումը որակական է (ցածր, միջին, բարձր) և չափված հաճախականություն չէ։ Ռեգիստրը վերանայվում է շաբաթական։ Ընտրեք ռիսկը՝ կանխարգելումը և արձագանքը տեսնելու համար։',
`<div class="mx" id="rm"></div><div class="card" id="rd" style="margin-top:14px"></div><p class="note">Հիմնական ռիսկի (R1) դեպքում միայն գովազդ ավելացնելը բավարար չէ․ ստուգվում է՝ խնդիրը վճա՞րն է, ժամանա՞կը, բովանդակությո՞ւնը, թե՞ առաջարկի վստահելիությունը։ Արդեն կատարված մշակման ծախսը չի վերանում հետաձգելու դեպքում։</p>`);

add('chg','Փոփոխությունների կառավարում','Օրինակ․ 5-րդ շաբաթում առաջարկվում է ավելացնել 8 ժամանոց նոր մոդուլ։ Առանց ժամանակի, ծախսի և ռեսուրսի համատեղ գնահատման դա կլինի շրջանակի անվերահսկելի ընդլայնում։',
tbl(['Ազդեցություն','Հաշվարկ','Արդյունք'],[['Մշակում, ուսուցում, գնահատում, աջակցություն','10×5,000 + 8×6,000 + 4.4×5,000 + 2×4,000 + 4×4,000 + 2×3,000','150,000 դրամ'],['Պահուստներով լրացուցիչ սահման','150,000 × 1.15','172,500 դրամ → նոր սահման 1,593,900'],['Ժամանակ','56 ժ, 6 ժ / շաբաթ, 3-ժամանոց հանդիպումներ','ուսուցում մինչև 10 շաբաթ, փակում մինչև 18-րդ շաբաթ']])+`<h3>Որոշման հերթականություն</h3><ol class="steps"><li>Գրանցել փոփոխության հայտը։</li><li>Գնահատել ակադեմիական և ֆինանսական ազդեցությունները։</li><li>Հովանավորին ներկայացնել տարբերակներ՝ տեղափոխել հաջորդ հոսքին կամ պաշտոնապես հաստատել նոր ծավալը։</li><li>Թարմացնել հաստատված պլանները և տեղեկացնել շահակիցներին։</li></ol><p class="note">Պահուստի առկայությունը շրջանակը փոխելու ինքնուրույն թույլտվություն չէ։ Օրինակային ընթացիկ խնդիր (I-01)՝ 5-րդ շաբաթում լսարանը մեկ օր զբաղված է․ վարչական պատասխանատուն առաջարկում է նախապես ստուգված այլ ժամ, նախագծի ղեկավարը համաձայնեցնում է, մասնակիցները ստանում են նոր օրացույցը (ուսումնական սցենար է)։</p>`);

add('close','Փակում և փոխանցում','Նախագիծը փակվում է միայն երբ ապացույցները կան։ Եթե ուսումնական կամ ֆինանսական KPI-ն չի կատարվել, նախագիծը չի ներկայացվում որպես անվերապահ հաջողություն․ հովանավորը որոշում է՝ պահանջել ուղղում, ընդունել փաստագրված բացառությամբ, թե չշարունակել հաջորդ հոսքը։',

const draw=n=>{const W=640,H=280,L=58,B=36,T=14,x=v=>L+(v-12)/14*(W-L-10),lo=900000,hi=2200000,y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);let s='';for(let v=1000000;v<=2200000;v+=400000)s+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${(v/1e6).toFixed(1)} մլն</text>`;for(let k=12;k<=26;k+=2)s+=`<text x="${x(k)}" y="${H-12}" text-anchor="middle">${k}</text>`;const pt=g=>Array.from({length:15},(_,i)=>`${x(12+i)},${y(g(12+i))}`).join(' ');s+=`<polyline fill="none" stroke="var(--co)" stroke-width="3" points="${pt(lim)}"/><polyline fill="none" stroke="var(--pri)" stroke-width="3" points="${pt(k=>80000*k)}"/><line x1="${x(n)}" x2="${x(n)}" y1="${T}" y2="${H-B}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${x(n)}" cy="${y(80000*n)}" r="6" fill="var(--pri)"/><circle cx="${x(n)}" cy="${y(lim(n))}" r="6" fill="var(--co)"/><text x="${x(25)}" y="${y(80000*25)-10}" text-anchor="end" style="fill:var(--pri);font-weight:700">Մուտք</text><text x="${x(14)}" y="${y(lim(14))-10}" style="fill:var(--co);font-weight:700">Լրիվ ռեսուրսային սահման</text>`;$('#sc').innerHTML=s;const d=80000*n-lim(n);$('#sn').textContent=n;$('#so').innerHTML=`<div><b>${f(80000*n)}</b><span>մուտք, դրամ</span></div><div><b>${f(lim(n))}</b><span>լրիվ ռեսուրսային սահման</span></div><div><b class="${d<0?'neg':'pos'}">${d<0?'−':'+'}${f(Math.abs(d))}</b><span>${d<0?'պակաս՝ պահանջվում է որոշում':'ծածկված է'}</span></div>`};
$('#sl').oninput=e=>draw(+e.target.value);draw(22);
/* cash flow */
(()=>{const W=640,H=270,L=58,B=40,T=14,hi=2000000,y=v=>T+(1-v/hi)*(H-T-B),g=[['6-րդ շ.',552000,880000],['10-րդ շ.',878000,1760000],['14-րդ շ.',1160000,1760000],['16-րդ շ.',1236000,1760000]];let s='';for(let v=0;v<=2000000;v+=500000)s+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${(v/1e6).toFixed(1)}</text>`;g.forEach((r,i)=>{const x0=L+20+i*145;s+=`<rect x="${x0}" y="${y(r[1])}" width="52" height="${y(0)-y(r[1])}" rx="5" fill="var(--co)"><title>Կուտակային ծախս՝ ${f(r[1])}</title></rect><rect x="${x0+58}" y="${y(r[2])}" width="52" height="${y(0)-y(r[2])}" rx="5" fill="var(--ok)"><title>Կուտակային մուտք՝ ${f(r[2])}</title></rect><text x="${x0+55}" y="${H-20}" text-anchor="middle">${r[0]}</text>`});s+=`<rect x="${W-250}" y="2" width="12" height="12" rx="3" fill="var(--co)"/><text x="${W-232}" y="12">Կուտակային ծախս</text><rect x="${W-120}" y="2" width="12" height="12" rx="3" fill="var(--ok)"/><text x="${W-102}" y="12">Մուտք</text>`;$('#cf').innerHTML=s})();

/* extras */
$$('.hb,.gantt').forEach(e=>reveal.observe(e));
const DC=['#0a6c8a','#1a8fb3','#4bb3d3','#7fd0e8','#2b5f9e','#5a86c7'],DC2=['#e8a317','#f0b83a','#d98a00','#ef5a67','#c1384a','#f48a93','#8a6bf0'];
{const all=[...dev.map((r,i)=>[r[0],r[2],DC[i]]),...flow.map((r,i)=>[r[0],r[2],DC2[i]])],T=1236000,C=2*Math.PI*90;let ac=0;
const arcs=all.map(r=>{const p=r[1]/T,o=`<circle cx="120" cy="120" r="90" fill="none" stroke="${r[2]}" stroke-width="40" stroke-dasharray="${p*C-2} ${C}" stroke-dashoffset="${-ac*C}"><title>${r[0]}՝ ${f(r[1])}</title></circle>`;ac+=p;return o}).join('');
const lg=(h,d,c)=>`<h4>${h}</h4>`+d.map((r,i)=>`<p><i style="background:${c[i]}"></i>${r[0]}<em>${f(r[2])}</em></p>`).join('');
$('#dn').innerHTML=`<div class="dc"><svg viewBox="0 0 240 240" role="img" aria-label="Ծախսերի կառուցվածք"><g transform="rotate(-90 120 120)">${arcs}</g></svg><div><b>1,236,000</b><span>դրամ</span></div></div><div class="lg">${lg('Մեկանգամյա մշակում՝ 556,000',dev,DC)}${lg('Առաջին հոսք՝ 680,000',flow,DC2)}</div>`}
$$('.kf strong').forEach(el=>{if(rm)return;const n=+el.dataset.n;let t0;const st=t=>{t0=t0||t;const k=Math.min(1,(t-t0)/1100);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};el.textContent=0;requestAnimationFrame(st)});
addEventListener('scroll',()=>{$('#pg').style.transform=`scaleX(${Math.min(1,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))})`},{passive:true});
</script>
